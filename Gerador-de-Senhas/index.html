<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Aleatórias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Bloco Principal do Gerador de Senhas-->
    <div class="container-senha">
        <h2>Gerador de Senhas</h2>

        <!--Entrada para exibir a senha gerada-->
        <div class="container-entrada">
            <input type="text" id="entrada" class="entrada" placeholder="Clique em Gerar" readonly>
            <i class="fa-regular fa-copy" id="btn-copiar" title="Copiar"></i>
        </div>

        <!--Opções de personalização de senha-->
        <div class="configuracoes">
            <!--Tamanho da senha-->
            <div class="slider-container">
                <div class="slider-valores">
                    <label for="comprimento">Tamanho da Senha</label>
                    <span id="valor-comprimento">12</span>
                </div>
                <input type="range" id="comprimento" min="6" max="25" value="12">
            </div>

            <!-- Opções: Maiúsculas, Minúsculas, Números, Símbolos -->
             <div class="controle-grupo">
                <label class="checkbox-container">Incluir Maiúsculas (A-Z)
                    <input type="checkbox" name="maiusculas" id="maiusculas" checked>
                    <span class="checkmark"></span>
                </label>
             </div>

             <div class="controle-grupo">
                <label class="checkbox-container">Incluir Minúsculas (a-z)
                    <input type="checkbox" name="minusculas" id="minusculas" checked>
                    <span class="checkmark"></span>
                </label>
             </div>

             <div class="controle-grupo">
                <label class="checkbox-container">Incluir Números (0-9)
                    <input type="checkbox" name="numeros" id="numeros" checked>
                    <span class="checkmark"></span>
                </label>
             </div>

             <div class="controle-grupo">
                <label class="checkbox-container">Incluir Símbolos (!@#...)
                    <input type="checkbox" name="simbolos" id="simbolos">
                    <span class="checkmark"></span>
                </label>
             </div>
        </div>

    <!-- Painel de medição de força da senha -->
        <div class="medidor-forca">
            <span class="medidor-titulo">Força da Senha</span>
            <div class="medidor-status">
                <span class="texto-forca" id="texto-forca">Média</span>
                <div class="barras" id="barras-forca">
                    <div class="barra"></div>
                    <div class="barra"></div>
                    <div class="barra"></div>
                    <div class="barra"></div>
                </div>
            </div>
        </div>

        <!-- Botão para disparar a geração da senha -->
        <button class="btn" id="btn-gerar">
            Gerar Senha <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- Div para alertas/notificações flutuantes (substitui o 'alert' do navegador) -->
     <div id="alerta-sucesso" class="alerta">
        <i class="fa-solid fa-circle-check"></i>Senha copiada com sucesso!
     </div>

     <!-- ==========================================
       8. LÓGICA JAVASCRIPT
       ========================================== -->
       <script src="script.js"></script>
</body>
</html>
