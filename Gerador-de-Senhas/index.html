<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Aleatórias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Bloco Principal do Gerador de Senhas-->
    <div class="container-senha">
        <h2>Gerador de Senhas</h2>

        <!--Entrada para exibir a senha gerada-->
        <div class="container-entrada">
            <input type="text" id="entrada" class="entrada" placeholder="Clique em Gerar" readonly>
            <i class="fa-regular fa-copy" id="btn-copiar" title="Copiar"></i>
        </div>

        <!--Opções de personalização de senha-->
        <div class="configuracoes">
            <!--Tamanho da senha-->
            <div class="slider-container">
                <div class="slider-valores">
                    <label for="comprimento">Tamanho da Senha</label>
                    <span id="valor-comprimento">12</span>
                </div>
                <input type="range" id="comprimento" min="6" max="25" value="12">
            </div>

            <!-- Opções: Maiúsculas, Minúsculas, Números, Símbolos -->
             
        </div>
    </div>
    
</body>
</html>
